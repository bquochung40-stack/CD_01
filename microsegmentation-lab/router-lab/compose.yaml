name: nau-router-lab

services:
  router:
    build: ./router
    hostname: R1-FRR
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      web_lan:
        ipv4_address: 10.10.10.1
      api_lan:
        ipv4_address: 10.10.20.1
      data_lan:
        ipv4_address: 10.10.30.1

  web-host:
    build: ./host
    cap_add: [NET_ADMIN]
    environment:
      LISTEN_PORT: "80"
      ROUTER_IP: 10.10.10.1
      REMOTE_NETS: "10.10.20.0/24 10.10.30.0/24"
    depends_on: [router]
    networks:
      web_lan:
        ipv4_address: 10.10.10.10

  api-host:
    build: ./host
    cap_add: [NET_ADMIN]
    environment:
      LISTEN_PORT: "3000"
      ROUTER_IP: 10.10.20.1
      REMOTE_NETS: "10.10.10.0/24 10.10.30.0/24"
    depends_on: [router]
    networks:
      api_lan:
        ipv4_address: 10.10.20.10

  db-host:
    build: ./host
    cap_add: [NET_ADMIN]
    environment:
      LISTEN_PORT: "5432"
      ROUTER_IP: 10.10.30.1
      REMOTE_NETS: "10.10.10.0/24 10.10.20.0/24"
    depends_on: [router]
    networks:
      data_lan:
        ipv4_address: 10.10.30.10

networks:
  web_lan:
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.254
  api_lan:
    ipam:
      config:
        - subnet: 10.10.20.0/24
          gateway: 10.10.20.254
  data_lan:
    ipam:
      config:
        - subnet: 10.10.30.0/24
          gateway: 10.10.30.254
