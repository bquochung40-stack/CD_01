! Cisco IOSv/IOS router baseline for GNS3 or EVE-NG.
! Adapt interface names to the actual image. Three independent L2 segments are required.
hostname R1-SEG
no ip domain-lookup
!
interface GigabitEthernet0/0
 description WEB-LAN 10.10.10.0/24
 ip address 10.10.10.1 255.255.255.0
 ip access-group WEB-IN in
 no shutdown
!
interface GigabitEthernet0/1
 description API-LAN 10.10.20.0/24
 ip address 10.10.20.1 255.255.255.0
 ip access-group API-IN in
 no shutdown
!
interface GigabitEthernet0/2
 description DATA-LAN 10.10.30.0/24
 ip address 10.10.30.1 255.255.255.0
 ip access-group DATA-IN in
 no shutdown
!
ip access-list extended WEB-IN
 10 permit tcp host 10.10.10.10 host 10.10.20.10 eq 3000
 90 deny ip 10.10.10.0 0.0.0.255 any log
!
ip access-list extended API-IN
 10 permit tcp host 10.10.20.10 eq 3000 host 10.10.10.10 established
 20 permit tcp host 10.10.20.10 host 10.10.30.10 eq 5432
 90 deny ip 10.10.20.0 0.0.0.255 any log
!
ip access-list extended DATA-IN
 10 permit tcp host 10.10.30.10 eq 5432 host 10.10.20.10 established
 90 deny ip 10.10.30.0 0.0.0.255 any log
!
end
