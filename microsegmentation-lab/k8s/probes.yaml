    tier: web
    role: diagnostic
spec:
  containers:
    - name: netshoot
      image: nau-segmentation-probe:1.0.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep 36000"]
---
apiVersion: v1
kind: Pod
metadata:
