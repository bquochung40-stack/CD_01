name: nau-segmentation

services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    environment:
      PORT: "3000"
      PGHOST: db
      PGUSER: labuser
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: recipes
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: recipes
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d recipes"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.20.0/24
  data:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24

volumes:
  postgres_data:
